<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubiks Cube | Interactive Showcase</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-green: #00ff9f;
            --brand-blue: #00d1ff;
            --brand-purple: #bd00ff;
            --bg-dark: #050505;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── BACKGROUND ── */
        .bg-glow {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 255, 159, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(189, 0, 255, 0.05) 0%, transparent 50%);
            z-index: -1;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--border) 1px, transparent 1px),
                            linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            opacity: 0.2;
            z-index: -1;
        }

        /* ── LAYOUT ── */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            align-items: center;
            gap: 80px;
        }

        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 40px;
                overflow-y: auto;
                height: 100vh;
                padding-top: 80px;
            }
        }

        /* ── TEXT CONTENT ── */
        .content {
            z-index: 10;
        }

        .category {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--brand-green);
            margin-bottom: 12px;
            display: block;
        }

        .title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            line-height: 1.1;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, var(--brand-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 1.1rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 480px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 255, 159, 0.05);
            border: 1px solid rgba(0, 255, 159, 0.2);
            border-radius: 100px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--brand-green);
            width: fit-content;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--brand-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--brand-green);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--brand-green);
            color: #000;
            border: none;
            box-shadow: 0 0 20px rgba(0, 255, 159, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 159, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: #fff;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ── CUBE VIEWPORT ── */
        .viewport-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cube-aura {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle at center, rgba(0, 255, 159, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            animation: pulse-aura 4s ease-in-out infinite;
        }

        @keyframes pulse-aura {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .cube-viewport {
            width: 320px;
            height: 320px;
            perspective: 1200px;
            perspective-origin: 50% 50%;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cubeScene {
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transform: rotateX(-22deg) rotateY(45deg);
        }

        .cubie {
            position: absolute;
            width: 66px;
            height: 66px;
            margin: -33px 0 0 -33px;
            transform-style: preserve-3d;
        }

        .cubie-face {
            position: absolute;
            width: 66px;
            height: 66px;
            border-radius: 6px;
            border: 4px solid #000;
        }

        .gloss {
            position: absolute;
            inset: 0;
            border-radius: 4px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            pointer-events: none;
        }

        .shine {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: rgba(0,0,0,0.2);
            border-radius: 0 0 4px 4px;
            pointer-events: none;
        }

        /* Colors */
        .fc-green { background: #009B48; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); }
        .fc-blue { background: #0051A2; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); }
        .fc-red { background: #C41E3A; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); }
        .fc-orange { background: #FF5800; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); }
        .fc-white { background: #FFFFFF; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1); }
        .fc-yellow { background: #FFD500; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); }
        .fc-inner { background: #111; border-color: transparent; }

        /* ── BRANDING ── */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 30px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            pointer-events: none;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            text-decoration: none;
        }

        .logo-box {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--brand-green), #00d1ff);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            font-size: 1rem;
            box-shadow: 0 0 20px rgba(0, 255, 159, 0.3);
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
            color: var(--brand-green);
            text-shadow: 0 0 10px rgba(0, 255, 159, 0.3);
        }

        .header-right {
            position: fixed;
            top: 0;
            right: 0;
            padding: 30px 40px;
            z-index: 1001;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .btn-more {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 100px;
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }

        .btn-more svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .btn-more:hover {
            background: rgba(0, 255, 159, 0.1);
            border-color: var(--brand-green);
            color: var(--brand-green);
            box-shadow: 0 0 20px rgba(0, 255, 159, 0.2);
            transform: translateY(-2px);
        }

        .btn-more:hover svg {
            transform: translateX(4px);
        }

        /* ── FOOTER ── */
        footer {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            z-index: 1000;
            pointer-events: none;
        }

        .made-with-love {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            pointer-events: auto;
            text-decoration: none;
            color: inherit;
            transition: color 0.3s ease;
        }

        .made-with-love:hover {
            color: var(--brand-green);
        }

        .heart {
            color: #ff3e3e;
            display: inline-block;
            animation: heart-pulse 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 5px rgba(255, 62, 62, 0.5));
        }

        @keyframes heart-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

    </style>
</head>
<body>
    <header>
        <a href="https://ui-hub.com" class="logo-container">
            <div class="logo-box">U</div>
            <span class="logo-text">UI HUB</span>
        </a>
    </header>

    <header class="header-right">
        <a href="https://ui-hub-design.vercel.app/" class="btn-more">
            <span>View More Components</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        </a>
    </header>

    <footer>
        <a href="https://ui-hub.com" class="made-with-love">
            Made with <span class="heart">❤️</span> by UI HUB
        </a>
    </footer>
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <div class="container">
        <!-- Left Side: Content -->
        <div class="content">
            <span class="category">Interactive 3D Piece</span>
            <h1 class="title">3D RUBIKS<br>ENGINE</h1>
            <p class="description">
                A high-performance Rubik's Cube simulation built with CSS 3D transforms. 
                Features physics-based rotation, scramble algorithms, and automated move tracking.
            </p>

            <div class="controls">
                <div class="status-badge">
                    <div class="status-dot"></div>
                    <span id="statusText">System Initialized</span>
                </div>
                
                <div class="btn-group">
                    <button id="scrambleBtn" class="btn btn-primary">
                        Scramble Cube
                    </button>
                    <button id="solveBtn" class="btn btn-secondary" disabled title="Scramble first to enable solve">
                        Auto Solve
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Side: Cube -->
        <div class="viewport-container">
            <div class="cube-aura"></div>
            <div class="cube-viewport" id="cubeViewport">
                <div id="cubeScene"></div>
            </div>
        </div>
    </div>

    <script>
        const STEP_PX = 66;
        const FC = {
            front: { bg: '#009B48', cls: 'fc-green' },
            back: { bg: '#0051A2', cls: 'fc-blue' },
            right: { bg: '#C41E3A', cls: 'fc-red' },
            left: { bg: '#FF5800', cls: 'fc-orange' },
            top: { bg: '#FFFFFF', cls: 'fc-white' },
            bottom: { bg: '#FFD500', cls: 'fc-yellow' },
            inner: { bg: '#111', cls: 'fc-inner' }
        };

        const FACE_DEFS = [
            { key: 'front', t: 'translateZ(33px)' },
            { key: 'back', t: 'rotateY(180deg) translateZ(33px)' },
            { key: 'right', t: 'rotateY(90deg) translateZ(33px)' },
            { key: 'left', t: 'rotateY(-90deg) translateZ(33px)' },
            { key: 'top', t: 'rotateX(90deg) translateZ(33px)' },
            { key: 'bottom', t: 'rotateX(-90deg) translateZ(33px)' }
        ];

        const MOVES = [
            { axis: 'y', slice: 1, angle: 90 }, { axis: 'y', slice: 1, angle: -90 },
            { axis: 'y', slice: 0, angle: 90 }, { axis: 'y', slice: 0, angle: -90 },
            { axis: 'y', slice: -1, angle: 90 }, { axis: 'y', slice: -1, angle: -90 },
            { axis: 'x', slice: 1, angle: 90 }, { axis: 'x', slice: 1, angle: -90 },
            { axis: 'x', slice: 0, angle: 90 }, { axis: 'x', slice: 0, angle: -90 },
            { axis: 'x', slice: -1, angle: 90 }, { axis: 'x', slice: -1, angle: -90 },
            { axis: 'z', slice: 1, angle: 90 }, { axis: 'z', slice: 1, angle: -90 },
            { axis: 'z', slice: -1, angle: 90 }, { axis: 'z', slice: -1, angle: -90 }
        ];

        const scene = document.getElementById('cubeScene');
        const viewport = document.getElementById('cubeViewport');
        const statusText = document.getElementById('statusText');
        const scrambleBtn = document.getElementById('scrambleBtn');
        const solveBtn = document.getElementById('solveBtn');

        let cubies = [];
        let history = [];
        let busy = false;
        let rotation = { x: -22, y: 45, dragging: false, lx: 0, ly: 0, velX: 0, velY: 0 };

        function updateStatus(text) {
            statusText.innerText = text;
        }

        function makeCubie(lx, ly, lz) {
            const el = document.createElement('div');
            el.className = 'cubie';
            
            FACE_DEFS.forEach(fd => {
                let fc = FC.inner;
                if (fd.key === 'front' && lz === 1) fc = FC.front;
                if (fd.key === 'back' && lz === -1) fc = FC.back;
                if (fd.key === 'right' && lx === 1) fc = FC.right;
                if (fd.key === 'left' && lx === -1) fc = FC.left;
                if (fd.key === 'top' && ly === 1) fc = FC.top;
                if (fd.key === 'bottom' && ly === -1) fc = FC.bottom;

                const face = document.createElement('div');
                face.className = `cubie-face ${fc.cls}`;
                face.style.transform = fd.t + (fc === FC.inner ? ' scale(0.98)' : '');
                
                if (fc !== FC.inner) {
                    face.innerHTML = '<div class="gloss"></div><div class="shine"></div>';
                }
                el.appendChild(face);
            });

            const m = new DOMMatrix().translate(lx * STEP_PX, -ly * STEP_PX, lz * STEP_PX);
            el.style.transform = m.toString();
            return { el, m };
        }

        function initCube() {
            scene.innerHTML = '';
            cubies = [];
            for (let y = 1; y >= -1; y--) {
                for (let x = -1; x <= 1; x++) {
                    for (let z = 1; z >= -1; z--) {
                        const c = makeCubie(x, y, z);
                        scene.appendChild(c.el);
                        cubies.push(c);
                    }
                }
            }
        }

        function snap(m) {
            m.m41 = Math.round(m.m41 / 66) * 66;
            m.m42 = Math.round(m.m42 / 66) * 66;
            m.m43 = Math.round(m.m43 / 66) * 66;
            ['m11', 'm12', 'm13', 'm21', 'm22', 'm23', 'm31', 'm32', 'm33'].forEach(k => {
                const v = m[k];
                if (Math.abs(v) < 0.1) m[k] = 0;
                else if (v > 0.9) m[k] = 1;
                else if (v < -0.9) m[k] = -1;
                else m[k] = Math.sign(v);
            });
        }

        async function rotateLayer(axis, slice, angle, ms) {
            const layer = cubies.filter(c => {
                const x = Math.round(c.m.m41 / 66);
                const y = Math.round(-c.m.m42 / 66);
                const z = Math.round(c.m.m43 / 66);
                return (axis === 'x' ? x : axis === 'y' ? y : z) === slice;
            });

            if (layer.length === 0) return;

            const pivot = document.createElement('div');
            pivot.style.cssText = 'position:absolute;transform-style:preserve-3d;transition:none;';
            scene.appendChild(pivot);
            layer.forEach(c => pivot.appendChild(c.el));

            pivot.getBoundingClientRect();
            if (ms > 0) pivot.style.transition = `transform ${ms}ms cubic-bezier(0.34, 1.25, 0.64, 1)`;
            const rotStr = axis === 'y' ? `rotateY(${angle}deg)` : axis === 'x' ? `rotateX(${angle}deg)` : `rotateZ(${angle}deg)`;
            pivot.style.transform = rotStr;

            await new Promise(r => setTimeout(r, ms + 40));

            const rotM = new DOMMatrix(rotStr);
            layer.forEach(c => {
                c.m = rotM.multiply(c.m);
                snap(c.m);
                scene.appendChild(c.el);
                c.el.style.transform = c.m.toString();
            });
            pivot.remove();
        }

        async function scramble() {
            if (busy) return;
            busy = true;
            history = [];
            updateStatus('Scrambling...');
            scrambleBtn.disabled = true;
            solveBtn.disabled = true;

            for (let i = 0; i < 12; i++) {
                const move = MOVES[Math.floor(Math.random() * MOVES.length)];
                history.push(move);
                await rotateLayer(move.axis, move.slice, move.angle, 200);
                await new Promise(r => setTimeout(r, 40));
            }

            busy = false;
            scrambleBtn.disabled = false;
            solveBtn.disabled = false;
            updateStatus('Scrambled');
        }

        async function solve() {
            if (busy || history.length === 0) return;
            busy = true;
            updateStatus('Solving...');
            scrambleBtn.disabled = true;
            solveBtn.disabled = true;

            const moves = [...history].reverse().map(m => ({ ...m, angle: -m.angle }));
            for (const move of moves) {
                await rotateLayer(move.axis, move.slice, move.angle, 350);
                await new Promise(r => setTimeout(r, 50));
            }

            history = [];
            busy = false;
            scrambleBtn.disabled = false;
            updateStatus('Solved!');
        }

        // ── INTERACTION ──
        function handleStart(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            rotation.dragging = true;
            rotation.lx = clientX;
            rotation.ly = clientY;
            rotation.velX = 0;
            rotation.velY = 0;
        }

        function handleMove(e) {
            if (!rotation.dragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = (clientX - rotation.lx) * 0.45;
            const dy = (clientY - rotation.ly) * 0.45;
            rotation.y += dx;
            rotation.x -= dy;
            rotation.x = Math.max(-80, Math.min(80, rotation.x));
            rotation.lx = clientX;
            rotation.ly = clientY;
            rotation.velX = dx;
            rotation.velY = dy;
        }

        function handleEnd() {
            rotation.dragging = false;
        }

        function animate() {
            if (!rotation.dragging) {
                rotation.velX *= 0.95;
                rotation.velY *= 0.95;
                rotation.y += rotation.velX;
                rotation.x -= rotation.velY;
                
                // Idle drift
                if (Math.abs(rotation.velX) < 0.01 && history.length === 0) {
                    rotation.y += 0.1;
                    rotation.x += ((-22 - rotation.x) * 0.05);
                }
            }
            scene.style.transform = `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`;
            requestAnimationFrame(animate);
        }

        viewport.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        viewport.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        scrambleBtn.onclick = scramble;
        solveBtn.onclick = solve;

        initCube();
        animate();

    </script>
</body>
</html>
